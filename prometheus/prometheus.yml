global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "node-server"
    static_configs:
      - targets: ["192.168.56.11:9100"]
        labels:
          instance: "node-server"
          env: "test"
          
  - job_name: "apache"
    static_configs:
      - targets: ["192.168.56.11:9117"]
        labels:
          instance: "node-server"
          service: "apache"
